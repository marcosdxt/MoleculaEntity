name: CI

on:
  push:
    branches: [main, devel]
  pull_request:

jobs:
  # This library's promise is `git clone && cmake && ctest`. The way not to break
  # it is for CI to do exactly that, on a clean runner, with more than one
  # compiler — a header library that has only ever been compiled by one compiler
  # isn't portable, it's lucky.
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    name: ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev libgtest-dev

      # No `pip install` at all: the generator uses `tomllib` from the Python
      # 3.11+ standard library, and only falls back to `tomli` on older Python.
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The two defects that cost the most here — the race in the uuid generator and
  # the timestamp read in the wrong timezone — don't show up in an ordinary test:
  # the first is a race, the second only fails outside UTC. Each gets its own job.
  sanitizers:
    runs-on: ubuntu-24.04
    name: ASan + UBSan + TSan
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev libgtest-dev

      - name: AddressSanitizer + UBSan
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan
          ctest --test-dir build-asan --output-on-failure

      # The system gtest isn't built with TSan, and mixing them reports false
      # positives; so here GoogleTest comes through FetchContent, compiled with
      # the same flags.
      - name: ThreadSanitizer
        run: |
          sudo apt-get remove -y libgtest-dev
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build-tsan
          ctest --test-dir build-tsan --output-on-failure

  # The timezone defect went unnoticed because CI runs in UTC, where reading local
  # time and reading UTC give the same answer. Running the suite outside UTC is
  # what keeps it from coming back.
  timezone:
    runs-on: ubuntu-24.04
    name: non-UTC timezone
    strategy:
      fail-fast: false
      matrix:
        tz: [America/Sao_Paulo, Asia/Tokyo]
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev libgtest-dev tzdata

      - name: Suite in ${{ matrix.tz }}
        env:
          TZ: ${{ matrix.tz }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
          ctest --test-dir build --output-on-failure

  # What installation promises: `find_package(MoleculaEntity)` has to work in
  # another project. Without this job, the Config file breaks and nobody finds out
  # until someone tries to consume it.
  install:
    runs-on: ubuntu-24.04
    name: install + find_package
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev

      - name: Install
        run: |
          cmake -S . -B build -G Ninja -DMOLECULA_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          cmake --build build --target install

      - name: Consume it from outside
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(consumer LANGUAGES CXX)
          find_package(MoleculaEntity REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE MoleculaEntity::SQLite3)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <MoleculaEntity/MoleculaEntity.hpp>
          #include <MoleculaEntity/SQLite3DatabaseManager.hpp>
          #include <cstdio>

          int main() {
              auto db = MoleculaEntity::SQLite3DatabaseManager::open(":memory:");
              if (!db) { std::puts("could not open"); return 1; }
              if (!db->execute("CREATE TABLE t (idx INTEGER PRIMARY KEY)")) { return 1; }
              std::puts("ok");
              return 0;
          }
          EOF
          cmake -S consumer -B consumer/build -G Ninja \
            -DCMAKE_PREFIX_PATH=$PWD/prefix
          cmake --build consumer/build
          ./consumer/build/consumer
