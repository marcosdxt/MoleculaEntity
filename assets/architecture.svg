<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 618" width="920" height="618"
     role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
  <title id="title">MoleculaEntity architecture</title>
  <desc id="desc">The TOML schema becomes code at build time. The application uses generated entities and repositories; they talk to the IDatabaseManager interface, and that is where the SQLite driver — or yours — plugs in.</desc>

  <style>
    :root { color-scheme: light dark; }
    .bg    { fill: #ffffff; }
    .box    { fill: #f8fafc; stroke: #cbd5e1; }
    .box-accent { fill: #eff6ff; stroke: #3b82f6; }
    .box-iface { fill: #f0fdfa; stroke: #14b8a6; }
    .band    { fill: #f1f5f9; stroke: #cbd5e1; }
    .title   { fill: #0f172a; }
    .text    { fill: #334155; }
    .muted    { fill: #64748b; }
    .arrow     { stroke: #64748b; fill: none; }
    .arrowhead    { fill: #64748b; }
    .port    { fill: #14b8a6; }
    .on-accent { fill: #1d4ed8; }
    .on-iface { fill: #0f766e; }

    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .box    { fill: #161b22; stroke: #30363d; }
      .box-accent { fill: #10243e; stroke: #58a6ff; }
      .box-iface { fill: #0c2b28; stroke: #2dd4bf; }
      .band    { fill: #11161d; stroke: #30363d; }
      .title   { fill: #e6edf3; }
      .text    { fill: #c9d1d9; }
      .muted    { fill: #8b949e; }
      .arrow     { stroke: #8b949e; }
      .arrowhead    { fill: #8b949e; }
      .port    { fill: #2dd4bf; }
      .on-accent { fill: #79c0ff; }
      .on-iface { fill: #5eead4; }
    }
  </style>

  <rect class="bg" width="920" height="618"/>

  <!-- ========================================================= build time -->
  <rect class="band" x="24" y="24" width="872" height="122" rx="10" stroke-dasharray="6 5"/>
  <text class="muted" x="44" y="50" font-size="13" font-weight="600" letter-spacing="1.2">BUILD TIME — HAPPENS ONCE, ON YOUR MACHINE</text>

  <rect class="box" x="44" y="64" width="176" height="62" rx="8"/>
  <text class="title" x="132" y="90" font-size="15" font-weight="600" text-anchor="middle">schema.toml</text>
  <text class="muted" x="132" y="110" font-size="12.5" text-anchor="middle">tables, columns, methods</text>

  <path class="arrow" d="M228 95 H286" stroke-width="1.6"/>
  <path class="arrowhead" d="M286 95 l-8 -4.5 v9 z"/>

  <rect class="box" x="296" y="64" width="196" height="62" rx="8"/>
  <text class="title" x="394" y="90" font-size="15" font-weight="600" text-anchor="middle">molecula_gen.py</text>
  <text class="muted" x="394" y="110" font-size="12.5" text-anchor="middle">Python, only here</text>

  <path class="arrow" d="M500 95 H558" stroke-width="1.6"/>
  <path class="arrowhead" d="M558 95 l-8 -4.5 v9 z"/>

  <rect class="box-accent" x="568" y="64" width="308" height="62" rx="8"/>
  <text class="on-accent" x="722" y="88" font-size="15" font-weight="600" text-anchor="middle">generated code</text>
  <text class="muted" x="722" y="108" font-size="12.5" text-anchor="middle">Entities · Repositories · DatabaseBootstrap</text>

  <!-- from the generated code into the application -->
  <path class="arrow" d="M722 132 V176" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path class="arrowhead" d="M722 176 l-4.5 -8 h9 z"/>
  <text class="muted" x="736" y="162" font-size="12">compiled in</text>

  <!-- ======================================================= the application -->
  <rect class="box" x="44" y="180" width="832" height="66" rx="10"/>
  <text class="title" x="70" y="207" font-size="16" font-weight="600">your application</text>
  <text class="muted" x="70" y="228" font-size="13">calls repositories and entities — and writes no SQL</text>

  <path class="arrow" d="M460 250 V292" stroke-width="1.6"/>
  <path class="arrowhead" d="M460 292 l-4.5 -8 h9 z"/>

  <!-- ========================================================= the library -->
  <rect class="box" x="44" y="296" width="832" height="140" rx="10"/>
  <text class="muted" x="68" y="322" font-size="13" font-weight="600" letter-spacing="1.2">MOLECULAENTITY — HEADER-ONLY, NO DEPENDENCIES</text>

  <rect class="box" x="68" y="336" width="186" height="78" rx="8"/>
  <text class="title" x="161" y="364" font-size="14.5" font-weight="600" text-anchor="middle">BaseEntity</text>
  <text class="muted" x="161" y="384" font-size="12" text-anchor="middle">idx · id (uuid)</text>
  <text class="muted" x="161" y="401" font-size="12" text-anchor="middle">created_at · updated_at</text>

  <rect class="box" x="266" y="336" width="186" height="78" rx="8"/>
  <text class="title" x="359" y="364" font-size="14.5" font-weight="600" text-anchor="middle">Repository&lt;T&gt;</text>
  <text class="muted" x="359" y="384" font-size="12" text-anchor="middle">save · find · remove</text>
  <text class="muted" x="359" y="401" font-size="12" text-anchor="middle">count · exists</text>

  <rect class="box" x="464" y="336" width="186" height="78" rx="8"/>
  <text class="title" x="557" y="364" font-size="14.5" font-weight="600" text-anchor="middle">QueryBuilder</text>
  <text class="muted" x="557" y="384" font-size="12" text-anchor="middle">values as <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">?</tspan></text>
  <text class="muted" x="557" y="401" font-size="12" text-anchor="middle">quoted identifiers</text>

  <rect class="box" x="662" y="336" width="186" height="78" rx="8"/>
  <text class="title" x="755" y="364" font-size="14.5" font-weight="600" text-anchor="middle">SchemaManager</text>
  <text class="muted" x="755" y="384" font-size="12" text-anchor="middle">CREATE TABLE</text>
  <text class="muted" x="755" y="401" font-size="12" text-anchor="middle">versioned migrations</text>

  <!-- ======================================================= the interface -->
  <path class="arrow" d="M460 440 V470" stroke-width="1.6"/>
  <path class="arrowhead" d="M460 470 l-4.5 -8 h9 z"/>

  <rect class="box-iface" x="44" y="474" width="832" height="46" rx="8"/>
  <circle class="port" cx="72" cy="497" r="7"/>
  <text class="on-iface" x="92" y="502" font-size="15" font-weight="600">IDatabaseManager</text>
  <text class="muted" x="252" y="502" font-size="13">the boundary: eleven methods, errors without exceptions, and no SQLite above this line</text>

  <!-- ============================================================ drivers -->
  <path class="arrow" d="M250 524 V556" stroke-width="1.6"/>
  <path class="arrowhead" d="M250 556 l-4.5 -8 h9 z"/>
  <path class="arrow" d="M672 524 V556" stroke-width="1.6"/>
  <path class="arrowhead" d="M672 556 l-4.5 -8 h9 z"/>

  <rect class="box-accent" x="80" y="560" width="340" height="44" rx="8"/>
  <text class="on-accent" x="250" y="580" font-size="14.5" font-weight="600" text-anchor="middle">SQLite3DatabaseManager</text>
  <text class="muted" x="250" y="596" font-size="12" text-anchor="middle">bundled · WAL · busy_timeout · never throws</text>

  <rect class="box" x="502" y="560" width="340" height="44" rx="8" stroke-dasharray="6 5"/>
  <text class="text" x="672" y="580" font-size="14.5" font-weight="600" text-anchor="middle">your driver</text>
  <text class="muted" x="672" y="596" font-size="12" text-anchor="middle">another database, a measuring decorator, a test double</text>
</svg>
